plugins {
    id 'com.android.application'
}

android {
    namespace 'com.royleib.fasthotspot'
    compileSdk 35

    defaultConfig {
        applicationId 'com.royleib.fasthotspot'
        // Android 10+: needed for WifiP2pConfig.Builder (custom name/password/5 GHz band).
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly; replace for Play Store.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
