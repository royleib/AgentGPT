name: Fast Hotspot Android app

on:
  push:
    paths:
      - "hotspot-app/**"
      - ".github/workflows/hotspot-android.yml"
  pull_request:
    paths:
      - "hotspot-app/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hotspot-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Proxy engine tests
        run: ./proxy-test/run.sh

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: FastHotspot-apk
          path: hotspot-app/app/build/outputs/apk/release/*.apk
